<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Graph Maker</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#243c35;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #d8e4dc;padding:16px max(18px,calc((100vw - 1260px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;letter-spacing:-.7px;margin:0}header p{margin:3px 0 0;color:#65766e;font-size:13px}.pill{font-size:12px;background:#e7f5ed;color:#226b4b;border-radius:30px;padding:6px 10px;white-space:nowrap}main{max-width:1260px;padding:18px;margin:auto;display:grid;grid-template-columns:minmax(330px,.93fr) minmax(440px,1.07fr);gap:18px;align-items:start}.stack{display:grid;gap:18px}.panel{background:#fff;border:1px solid #dce8e0;border-radius:17px;padding:18px;box-shadow:0 2px 12px #2a4b3710}.panel h2{font-size:17px;margin:0 0 5px}.hint{font-size:13px;color:#6b7c73;margin:0 0 14px;line-height:1.4}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.heading h2{margin:0}button{font:inherit;cursor:pointer;border:1px solid #b9d5c6;background:white;color:#235a42;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:650;touch-action:manipulation}button:active{transform:scale(.98)}button.primary{background:#287c58;color:white;border-color:#287c58}button:hover{filter:brightness(.97)}.buttons{display:flex;flex-wrap:wrap;gap:8px}.table-wrap{overflow:auto;border:1px solid #d9e5de;border-radius:9px;max-height:350px}table{border-collapse:collapse;width:100%;min-width:360px}th{background:#e9f3ec;color:#355f49;font-size:12px;font-weight:700;padding:8px;position:sticky;top:0;z-index:1}td{border-top:1px solid #e5ede8;border-right:1px solid #e5ede8;padding:0}th:first-child,td:first-child{background:#f5f8f5;width:35px;text-align:center;border-right:1px solid #dce7e0;font-size:12px;color:#82958a}td input{display:block;border:0;border-radius:0;width:100%;height:38px;min-width:68px;padding:6px 8px;font:inherit;font-size:14px;color:#1e3c2e;background:transparent}td input:focus{outline:2px solid #4aae7a;outline-offset:-2px;background:#f4fff7}.row-actions{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}.row-actions button{padding:7px 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:12px;color:#526b5c;font-weight:700}.field input,.field select{width:100%;border:1px solid #cadbd0;border-radius:9px;padding:10px;min-height:42px;background:#fff;color:#243c35;font:inherit;font-size:14px}.field input:focus,.field select:focus{outline:2px solid #86c9a0;outline-offset:1px}.wide{grid-column:1/-1}.checkline{display:flex;align-items:center;gap:8px;border:1px solid #dce8e0;border-radius:10px;padding:11px;font-size:14px}.checkline input{width:18px;height:18px;accent-color:#27845b}.errorbox{margin-top:13px;background:#f2f8f4;border-radius:12px;padding:12px}.errorbox h3{margin:0 0 8px;font-size:13px}.small{font-size:12px;line-height:1.5;color:#697d70}.small strong{color:#345d48}.errors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center;margin-top:8px}.errors input{width:100%;padding:7px;border-radius:7px;border:1px solid #cddbd1;min-width:0;font-size:13px}.errors .head{font-weight:700;font-size:11px;color:#547261}.preview{position:sticky;top:12px}.canvas-wrap{border:1px solid #e0e7e1;background:#fff;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio: 1000 / 650}.status{min-height:19px;font-size:12px;color:#477353;margin-top:9px}.notices{margin-top:11px;color:#80663f;background:#fff9ec;border-radius:9px;padding:10px;font-size:12px;display:none}.divider{height:1px;background:#e6ede7;margin:14px 0}.footer{color:#778a7d;font-size:12px;text-align:center;padding:10px 20px 30px}@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}.preview{position:static}.panel{padding:15px}header{padding:13px 16px}h1{font-size:21px}}@media(max-width:500px){.grid2{gap:10px}.field input,.field select{font-size:16px}.errorbox{padding:10px}.pill{display:none}}
.stack,.panel,.preview{min-width:0}
@media(pointer:coarse){
button,.checkline,.field input,.field select,.errors input,td input{min-height:44px}
td input,th input,.field input,.field select,.errors input{font-size:16px!important}
.table-wrap{max-height:340px}
}
@media(max-width:850px){main{grid-template-columns:minmax(0,1fr)}}
@media(max-width:420px){table{min-width:270px}}
header{flex-wrap:wrap}.panel h2{margin-bottom:12px}
.wordmark{display:inline-flex;align-items:center;gap:10px;padding:3px 15px 3px 4px;border-radius:12px;background:linear-gradient(145deg,#287c58,#19553f);color:#fff;font-size:21px;font-weight:800;line-height:1;letter-spacing:-.6px;white-space:nowrap}
.graph-logo{position:relative;flex:none;width:36px;height:36px}
.graph-logo-axes{position:absolute;inset:7px 3px 7px 7px;border-left:2px solid #bce3cc;border-bottom:2px solid #bce3cc;border-radius:0 0 0 3px}
.graph-logo-points{position:absolute;left:12px;top:22px;width:4px;height:4px;border-radius:50%;background:#e8fff0;box-shadow:5px -6px #e8fff0,10px -4px #e8fff0,15px -14px #fde579}
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
header .wordmark{grid-column:2;grid-row:1;justify-self:center}
header #example{grid-column:1;grid-row:1;justify-self:start}
header #clear{grid-column:3;grid-row:1;justify-self:end}
@media(max-width:500px){
header{grid-template-columns:1fr 1fr}
header .wordmark{grid-column:1/-1}
header #example{grid-column:1;grid-row:2}
header #clear{grid-column:2;grid-row:2}
}
</style>
</head>
<body>
<header><button id="example">Show an example</button><h1 class="wordmark"><span class="graph-logo" aria-hidden="true"><span class="graph-logo-axes"></span><span class="graph-logo-points"></span></span><span>Graph Maker</span></h1><button id="clear">Clear all data</button></header>
<main>
<div class="stack">
<section class="panel"><h2>1. Enter your data</h2><div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><div class="row-actions"><button id="addRow">+ Add row</button><button id="addCol">+ Add column</button></div></section>
<section class="panel"><h2>2. Choose your graph</h2><div class="grid2">
<div class="field wide"><label for="type">Graph type</label><select id="type"><option value="scatter">Scatter graph (points)</option><option value="line">Line graph (points connected)</option><option value="bar">Bar chart</option></select></div>
<div class="field wide"><label for="title">Graph title</label><input id="title" placeholder="e.g. Effect of light on plant growth"></div>
<div class="field"><label for="xcol">X axis column (IV)</label><select id="xcol"></select></div><div class="field"><label for="ycol">Y axis column (DV)</label><select id="ycol"></select></div>
<div class="field"><label for="xlabel">X axis label</label><input id="xlabel" placeholder="Independent variable"></div><div class="field"><label for="xunit">X axis units</label><input id="xunit" placeholder="e.g. hours"></div>
<div class="field"><label for="ylabel">Y axis label</label><input id="ylabel" placeholder="Dependent variable"></div><div class="field"><label for="yunit">Y axis units</label><input id="yunit" placeholder="e.g. cm"></div>
<div class="wide"><label class="checkline"><input type="checkbox" id="trend"> Add a line of best fit (trend line)</label></div>
<div class="wide"><label class="checkline"><input type="checkbox" id="error"> Show error bars</label></div>
</div>
<div id="errorbox" class="errorbox" hidden><div class="field"><label for="errtype">Error bars represent</label><select id="errtype"><option value="range">Range (minimum and maximum)</option><option value="sd">Standard deviation (± SD)</option></select></div><div id="errors"></div></div>
</section>
</div>
<section class="panel preview"><h2>3. Your graph</h2><div class="canvas-wrap"><canvas id="chart" width="1000" height="650"></canvas></div><div id="notices" class="notices"></div><div class="divider"></div><div class="buttons"><button id="copy" class="primary">⧉ Copy graph</button><button id="download">↓ Save PNG</button><button id="resetZoom">Reset axes</button></div><div class="status" id="status" role="status" aria-live="polite"></div></section>
</main><div class="footer">Your data stays on this device. No account required.</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const defaults=[['0','0.4'],['2','1.3'],['4','2.6'],['6','3.8'],['8','4.5'],['10','4.7']];
let headers=['Column A','Column B'];let rows=Array.from({length:6},()=>['','']);let errValues={};let zoomPad=0.08;
const ids=['type','title','xcol','ycol','xlabel','xunit','ylabel','yunit','trend','error','errtype'];
function escapeText(s){return String(s).replace(/[&<>"']/g,v=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[v]))}
function asNum(v){if(v==null||String(v).trim()==='')return NaN;let n=Number(String(v).trim());return Number.isFinite(n)?n:NaN}
function sel(){return {x:Number($('xcol').value)||0,y:Number($('ycol').value||1)}}
function buildTable(){
$('tableHead').innerHTML='<tr><th>#</th>'+headers.map((h,i)=>`<th><input aria-label="Column ${i+1} name" data-h="${i}" value="${escapeText(h)}" style="border:0;background:transparent;min-width:74px;width:100%;font:inherit;color:inherit;font-weight:700;text-align:center" /></th>`).join('')+'</tr>';
$('tableBody').innerHTML=rows.map((r,i)=>'<tr><td>'+(i+1)+'</td>'+headers.map((_,j)=>`<td><input aria-label="Row ${i+1}, column ${j+1}" data-r="${i}" data-c="${j}" value="${escapeText(r[j]??'')}" /></td>`).join('')+'</tr>').join('');
refreshSelectors();render();
}
function refreshSelectors(){let a=sel();let oldx=$('xcol').value,oldy=$('ycol').value;for(let id of ['xcol','ycol']){$(id).innerHTML=headers.map((h,i)=>`<option value="${i}">${String.fromCharCode(65+i)}: ${escapeText(h||'Column '+(i+1))}</option>`).join('')};$('xcol').value=(oldx!==''&&Number(oldx)<headers.length)?oldx:'0';$('ycol').value=(oldy!==''&&Number(oldy)<headers.length)?oldy:String(Math.min(1,headers.length-1));}
function pasteGrid(startR,startC,raw){let lines=raw.replace(/\r/g,'').trimEnd().split('\n').map(l=>l.split('\t'));if(lines.length===1&&lines[0].length===1)return false;
while(headers.length<startC+Math.max(...lines.map(l=>l.length)))headers.push('Column '+String.fromCharCode(65+headers.length));
while(rows.length<startR+lines.length)rows.push(Array(headers.length).fill(''));
rows.forEach(r=>{while(r.length<headers.length)r.push('')});
lines.forEach((line,i)=>line.forEach((value,j)=>rows[startR+i][startC+j]=value));buildTable();return true;
}
$('tableBody').addEventListener('input',e=>{let el=e.target;if(!el.matches('input[data-r]'))return;rows[+el.dataset.r][+el.dataset.c]=el.value;render();});
$('tableBody').addEventListener('paste',e=>{let el=e.target;if(!el.matches('input[data-r]'))return;let data=e.clipboardData.getData('text/plain');if(data.includes('\t')||data.includes('\n')){e.preventDefault();pasteGrid(+el.dataset.r,+el.dataset.c,data)}});
$('tableHead').addEventListener('input',e=>{if(e.target.matches('[data-h]')){headers[+e.target.dataset.h]=e.target.value;refreshSelectors();render()}});
$('addRow').onclick=()=>{rows.push(Array(headers.length).fill(''));buildTable();let i=$('tableBody').querySelector(`input[data-r="${rows.length-1}"]`);if(i)i.focus()};
$('addCol').onclick=()=>{if(headers.length>=12)return;headers.push('Column '+String.fromCharCode(65+headers.length));rows.forEach(r=>r.push(''));buildTable()};
function resetOptions(){
for(const id of ['title','xlabel','xunit','ylabel','yunit']) $(id).value='';
for(const id of ['status']) $(id).textContent='';
$('type').value='scatter';
$('trend').checked=false;
$('error').checked=false;
$('errtype').value='range';
$('xcol').value='0';
$('ycol').value='1';
}
$('clear').onclick=()=>{
headers=['Column A','Column B'];
rows=Array.from({length:6},()=>['','']);
errValues={};
resetOptions();
buildTable();
$('status').textContent='All data cleared.';
};
$('tableBody').addEventListener('keydown',event=>{
const directions={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
const direction=directions[event.key];
const cell=event.target;
if(!direction||!cell.matches('input[data-r]')||event.shiftKey||event.ctrlKey||event.altKey||event.metaKey||event.isComposing)return;
const row=Number(cell.dataset.r)+direction[0];
const column=Number(cell.dataset.c)+direction[1];
const next=$('tableBody').querySelector(`input[data-r="${row}"][data-c="${column}"]`);
if(next){event.preventDefault();next.focus();next.select()}
});
$('example').onclick=()=>{resetOptions();headers=['Light exposure','Growth'];rows=defaults.map(r=>r.slice());errValues={};$('type').value='scatter';$('title').value='Effect of light on plant growth';$('xlabel').value='Light exposure';$('xunit').value='hours';$('ylabel').value='Growth';$('yunit').value='cm';$('trend').checked=false;$('error').checked=false;$('xcol').value='0';$('ycol').value='1';$('status').textContent='';buildTable()};
ids.forEach(id=>{$(id).addEventListener('input',render);$(id).addEventListener('change',render)});
$('resetZoom').onclick=()=>{zoomPad=0.08;render();$('status').textContent='Axes reset to automatic scale.'};
function points(){let {x,y}=sel();return rows.map((r,i)=>({x:asNum(r[x]),y:asNum(r[y]),key:i})).filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))}
function errorInput(p,field){return errValues[`${p.key}_${field}`]??''}
function updateErrors(ps){let box=$('errorbox');box.hidden=!$('error').checked;if(box.hidden)return;
let typ=$('errtype').value;
$('errors').innerHTML='<div class="errors"><div class="head">IV value</div><div class="head">'+(typ==='sd'?'Standard deviation':'Minimum')+'</div><div class="head">'+(typ==='sd'?'':'Maximum')+'</div>'+ps.map(p=>`<div>${escapeText(String(p.x))}</div><input inputmode="decimal" type="${typ==='sd'?'text':'number'}" step="any" data-key="${p.key}" data-field="${typ==='sd'?'sd':'min'}" value="${escapeText(errorInput(p,typ==='sd'?'sd':'min'))}" placeholder="${typ==='sd'?'SD':'Min'}"><div>${typ==='sd'?'':`<input inputmode="decimal" type="number" step="any" data-key="${p.key}" data-field="max" value="${escapeText(errorInput(p,'max'))}" placeholder="Max">`}</div>`).join('')+'</div>';
}
$('errors').addEventListener('input',e=>{let t=e.target;if(!t.matches('[data-key]'))return;errValues[t.dataset.key+'_'+t.dataset.field]=t.value;draw();});
function regression(ps){if(ps.length<2)return null;let n=ps.length,sx=0,sy=0,sxx=0,sxy=0;for(const p of ps){sx+=p.x;sy+=p.y;sxx+=p.x*p.x;sxy+=p.x*p.y}let den=n*sxx-sx*sx;if(Math.abs(den)<1e-12)return null;let slope=(n*sxy-sx*sy)/den;return {slope,intercept:(sy-slope*sx)/n};}
function niceStep(range,target=6){let raw=range/target;if(!(raw>0))return 1;let pow=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/pow;return (f<=1?1:f<=2?2:f<=5?5:10)*pow}
function fmt(n){if(!Number.isFinite(n))return '';if(Math.abs(n)<1e-10)return '0';return Number(n.toPrecision(5)).toString()}
function draw(){const c=$('chart'),ctx=c.getContext('2d');const W=1000,H=650;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
const ps=points(),type=$('type').value,errOn=$('error').checked,errType=$('errtype').value;let notes=[];
if(!ps.length){$('notices').style.display='none';return}
const title=$('title').value.trim()||'Untitled graph',xl=$('xlabel').value.trim()||headers[sel().x],yl=$('ylabel').value.trim()||headers[sel().y];let xName=xl+($('xunit').value.trim()?' ('+$('xunit').value.trim()+')':''),yName=yl+($('yunit').value.trim()?' ('+$('yunit').value.trim()+')':'');
ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#1f3229';ctx.font='bold 28px system-ui, sans-serif';const titleLines=[];let remaining=title;while(remaining.length>65&&titleLines.length<2){let split=remaining.lastIndexOf(' ',65);if(split<12)split=65;titleLines.push(remaining.slice(0,split));remaining=remaining.slice(split).trim()}titleLines.push(remaining);titleLines.slice(0,3).forEach((s,i)=>ctx.fillText(s,W/2,37+i*32,W-65));
const L=133,R=60,T=104+(titleLines.length-1)*26,B=105,pw=W-L-R,ph=H-T-B;

let xVals=ps.map(p=>p.x),yVals=ps.map(p=>p.y),xmin=Math.min(...xVals),xmax=Math.max(...xVals),ymin=Math.min(...yVals),ymax=Math.max(...yVals);
if(errOn){for(const p of ps){let sd=asNum(errorInput(p,'sd')),mi=asNum(errorInput(p,'min')),ma=asNum(errorInput(p,'max'));if(errType==='sd'&&sd>=0){ymin=Math.min(ymin,p.y-sd);ymax=Math.max(ymax,p.y+sd)}if(errType==='range'&&Number.isFinite(mi)&&Number.isFinite(ma)&&mi<=ma){ymin=Math.min(ymin,mi);ymax=Math.max(ymax,ma)}}}
if(type==='bar'){ymin=Math.min(0,ymin);ymax=Math.max(0,ymax)}
let xd=xmax-xmin||Math.max(1,Math.abs(xmin)*.3),yd=ymax-ymin||Math.max(1,Math.abs(ymin)*.3);
if(type==='bar'){xmin-=xd*0.09;xmax+=xd*0.09;xd=xmax-xmin} else {xmin-=xd*zoomPad;xmax+=xd*zoomPad}
ymin-=(yd*.08);ymax+=(yd*.12);if(type==='bar'&&ymin<0&&ps.every(p=>p.y>=0))ymin=0;
const xpx=x=>L+(x-xmin)/(xmax-xmin)*pw,ypx=y=>T+ph-(y-ymin)/(ymax-ymin)*ph;
ctx.lineWidth=1;ctx.strokeStyle='#e6ede8';ctx.fillStyle='#607267';ctx.font='17px system-ui';ctx.textBaseline='middle';
function ticks(min,max,target){
const step=niceStep(max-min,target);
const first=Math.ceil(min/step)*step;
return Array.from({length:target+1},(_,i)=>first+i*step).filter(v=>Number.isFinite(v)&&v>=min&&v<=max);
}
const yTicks=ticks(ymin,ymax,6);
for(const v of yTicks){let y=ypx(v);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.textAlign='right';ctx.fillText(fmt(v),L-14,y)}
ctx.strokeStyle='#333e37';ctx.lineWidth=2;ctx.beginPath();const verticalAxis=L;
const horizontalAxis=T+ph;
ctx.moveTo(verticalAxis,T);ctx.lineTo(verticalAxis,T+ph);
ctx.moveTo(L,horizontalAxis);ctx.lineTo(W-R,horizontalAxis);ctx.stroke();
const xTicks=type==='bar'&&ps.length<15?[...new Set(ps.map(p=>p.x))].filter(x=>x>=xmin&&x<=xmax):ticks(xmin,xmax,7);
ctx.font='16px system-ui';ctx.textAlign='center';ctx.textBaseline='top';for(const x of xTicks){let a=xpx(x);ctx.strokeStyle='#3d5246';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a,horizontalAxis);ctx.lineTo(a,horizontalAxis+8);ctx.stroke();ctx.fillStyle='#607267';ctx.fillText(fmt(x),a,horizontalAxis+13)}
ctx.fillStyle='#24392d';ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText(xName,W/2,H-40,W-150);ctx.save();ctx.translate(35,T+ph/2);ctx.rotate(-Math.PI/2);ctx.textBaseline='middle';ctx.fillText(yName,0,0,ph+100);ctx.restore();
ctx.save();ctx.beginPath();ctx.rect(L,T,pw,ph);ctx.clip();
if(type==='bar'){let uniq=[...new Set(xVals)].sort((a,b)=>a-b);let minGap=Infinity;for(let i=1;i<uniq.length;i++)minGap=Math.min(minGap,uniq[i]-uniq[i-1]);let width=uniq.length>1?Math.min(62,Math.abs(xpx(minGap)-xpx(0))*.62):80;for(const p of ps){let x=xpx(p.x),y=ypx(p.y),z=ypx(0);ctx.fillStyle='#64b68b';ctx.strokeStyle='#2e8057';ctx.lineWidth=1.2;ctx.fillRect(x-width/2,Math.min(y,z),width,Math.abs(z-y));ctx.strokeRect(x-width/2,Math.min(y,z),width,Math.abs(z-y))}}else{if(type==='line'){let sorted=[...ps].sort((a,b)=>a.x-b.x);ctx.strokeStyle='#27865c';ctx.lineWidth=3;ctx.beginPath();sorted.forEach((p,i)=>i?ctx.lineTo(xpx(p.x),ypx(p.y)):ctx.moveTo(xpx(p.x),ypx(p.y)));ctx.stroke()}for(const p of ps){ctx.fillStyle='#2c8e63';ctx.beginPath();ctx.arc(xpx(p.x),ypx(p.y),6.2,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}}
if(errOn){let valid=0;for(const p of ps){let lo,hi;if(errType==='sd'){let sd=asNum(errorInput(p,'sd'));if(!Number.isFinite(sd)||sd<0)continue;lo=p.y-sd;hi=p.y+sd}else{lo=asNum(errorInput(p,'min'));hi=asNum(errorInput(p,'max'));if(!Number.isFinite(lo)||!Number.isFinite(hi)||lo>hi)continue}valid++;let x=xpx(p.x),ya=ypx(hi),yb=ypx(lo);ctx.strokeStyle='#2c4537';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,ya);ctx.lineTo(x,yb);ctx.moveTo(x-10,ya);ctx.lineTo(x+10,ya);ctx.moveTo(x-10,yb);ctx.lineTo(x+10,yb);ctx.stroke()}if(valid<ps.length)notes.push(`Error bars shown for ${valid} of ${ps.length} points. Enter ${errType==='sd'?'an SD':'a minimum and maximum'} for each point.`)}

ctx.restore();
